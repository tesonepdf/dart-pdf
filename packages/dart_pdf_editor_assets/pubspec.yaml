name: dart_pdf_editor_assets
description: >-
  Optional bundled assets for dart_pdf_editor - the fifteen editor fonts, the
  metric-compatible faces the renderer substitutes into unembedded text (TeX
  Gyre for the standard 14, Carlito for Calibri), and the prebuilt web render
  worker. Depend on it (and call registerBundledEditorAssets) for the
  full-featured editor; omit it for a size-minimal viewer that ships none of
  them.
version: 13.0.0
repository: https://github.com/tesonepdf/dart-pdf/tree/main/packages/dart_pdf_editor_assets
issue_tracker: https://github.com/tesonepdf/dart-pdf/issues
topics:
  - pdf
  - pdf-editor
  - fonts
  - assets
resolution: workspace

environment:
  sdk: ^3.5.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # The registration API and the PdfBundledFont / global-config symbols it
  # populates live in the editor package; this package supplies the bytes.
  dart_pdf_editor: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # substitute_metrics_test.dart reads the bundled faces with pdf_graphics' own
  # OpenType parser and checks them against pdf_document's AFM tables - the
  # contract that makes them safe to substitute at all.
  pdf_document: ^13.0.0
  pdf_graphics: ^13.0.0

flutter:
  # The optional editor assets. These are declared here, not in
  # dart_pdf_editor, so an app that only views PDFs never bundles them: Flutter
  # includes a package's declared assets on every build target, so the only way
  # to make them opt-in is to keep them out of the always-depended-on package.
  #
  # Fonts offered by the editor font menu, plus the families the renderer
  # substitutes for unembedded text: TeX Gyre for the standard 14, Carlito for
  # Calibri. DejaVu is a permissive Bitstream Vera / Arev licence; Fira Sans,
  # Spectral, Lobster, Carlito, Arimo, Tinos, Cousine, Caladea, Gelasio, Open
  # Sans, Comic Neue and EB Garamond are SIL Open Font Licence; the TeX Gyre
  # families use the GUST Font License - see the *-LICENSE.txt files in
  # assets/fonts/. The forty most common free fonts added after those (Roboto,
  # Lato, Montserrat, ... Dancing Script) are all SIL Open Font Licence, regular
  # weight only, static TrueType; each has its own *-LICENSE.txt.
  assets:
    - assets/web/pdf_render_worker.dart.js
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSerif.ttf
    - assets/fonts/DejaVuSansMono.ttf
    - assets/fonts/FiraSans-Regular.ttf
    - assets/fonts/Spectral-Regular.ttf
    - assets/fonts/Lobster-Regular.ttf
    - assets/fonts/Arimo-Regular.ttf
    - assets/fonts/Tinos-Regular.ttf
    - assets/fonts/Cousine-Regular.ttf
    - assets/fonts/Caladea-Regular.ttf
    - assets/fonts/Gelasio-Regular.ttf
    - assets/fonts/OpenSans-Regular.ttf
    - assets/fonts/ComicNeue-Regular.ttf
    - assets/fonts/EBGaramond-Regular.ttf
    - assets/fonts/TeXGyreHeros-Regular.otf
    - assets/fonts/TeXGyreHeros-Bold.otf
    - assets/fonts/TeXGyreHeros-Italic.otf
    - assets/fonts/TeXGyreHeros-BoldItalic.otf
    - assets/fonts/TeXGyreTermes-Regular.otf
    - assets/fonts/TeXGyreTermes-Bold.otf
    - assets/fonts/TeXGyreTermes-Italic.otf
    - assets/fonts/TeXGyreTermes-BoldItalic.otf
    - assets/fonts/TeXGyreCursor-Regular.otf
    - assets/fonts/TeXGyreCursor-Bold.otf
    - assets/fonts/TeXGyreCursor-Italic.otf
    - assets/fonts/TeXGyreCursor-BoldItalic.otf
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Lato-Regular.ttf
    - assets/fonts/Montserrat-Regular.ttf
    - assets/fonts/Poppins-Regular.ttf
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/SourceSans3-Regular.ttf
    - assets/fonts/Nunito-Regular.ttf
    - assets/fonts/Ubuntu-Regular.ttf
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/WorkSans-Regular.ttf
    - assets/fonts/Raleway-Regular.ttf
    - assets/fonts/Oswald-Regular.ttf
    - assets/fonts/PTSans-Regular.ttf
    - assets/fonts/Rubik-Regular.ttf
    - assets/fonts/Quicksand-Regular.ttf
    - assets/fonts/Mulish-Regular.ttf
    - assets/fonts/Karla-Regular.ttf
    - assets/fonts/Cabin-Regular.ttf
    - assets/fonts/TitilliumWeb-Regular.ttf
    - assets/fonts/JosefinSans-Regular.ttf
    - assets/fonts/Barlow-Regular.ttf
    - assets/fonts/IBMPlexSans-Regular.ttf
    - assets/fonts/DMSans-Regular.ttf
    - assets/fonts/RobotoCondensed-Regular.ttf
    - assets/fonts/Merriweather-Regular.ttf
    - assets/fonts/PlayfairDisplay-Regular.ttf
    - assets/fonts/Lora-Regular.ttf
    - assets/fonts/PTSerif-Regular.ttf
    - assets/fonts/NotoSerif-Regular.ttf
    - assets/fonts/SourceSerif4-Regular.ttf
    - assets/fonts/LibreBaskerville-Regular.ttf
    - assets/fonts/CrimsonText-Regular.ttf
    - assets/fonts/RobotoSlab-Regular.ttf
    - assets/fonts/CormorantGaramond-Regular.ttf
    - assets/fonts/Bitter-Regular.ttf
    - assets/fonts/SourceCodePro-Regular.ttf
    - assets/fonts/RobotoMono-Regular.ttf
    - assets/fonts/IBMPlexMono-Regular.ttf
    - assets/fonts/BebasNeue-Regular.ttf
    - assets/fonts/DancingScript-Regular.ttf
    - assets/fonts/TeXGyreAdventor-Regular.otf
    - assets/fonts/TeXGyreAdventor-Bold.otf
    - assets/fonts/Carlito-Regular.ttf
    - assets/fonts/Carlito-Bold.ttf
    - assets/fonts/Carlito-Italic.ttf
    - assets/fonts/Carlito-BoldItalic.ttf
  # Declared families are the ones the renderer *names* while painting, so they
  # have to be registered from the first paint: DejaVu Sans as the script
  # fallback for Arabic/Hebrew/Greek/Cyrillic in arbitrary PDFs
  # (`CanvasPdfDevice._defaultFontFallbacks`), and the four TeX Gyre families as
  # the metric-compatible substitutes for unembedded standard-14 text
  # (font_substitution.dart). Declaring a family puts it in FontManifest.json,
  # which CanvasKit fetches and parses at web startup before the first frame, so
  # this list is kept to faces a page can actually be drawn with - the five menu
  # faces, used only to preview their own menu rows, are deliberately NOT
  # declared. They stay listed under `assets:` above (loaded as raw bytes for
  # embedding, and for composite-text fallback) and are registered lazily with
  # the engine the first time the font menu opens (`_ensureBundledFontPreview`
  # in editing_fonts.dart), keeping ~1.85 MB of font parsing off cold start.
  #
  # Measured off a deployed web build: the TeX Gyre faces cost 0.77 MB of that
  # cold start (1.7 MB of files) and Carlito 0.86 MB (2.6 MB of files - its
  # TrueType hinting compresses to a quarter, where their CFF outlines halve).
  # That buys every standard-14 and every unembedded-Calibri
  # page the advances it was typeset against on every platform: a substitute
  # with different advances does not just look different, it opens white space
  # inside words - or, where the substitute is the wider face, crowds the
  # glyphs into each other - because the renderer places each character at the
  # PDF's own pen offset. See
  # doc/dev-log/2026-09-10-standard-14-metric-substitutes.md and
  # doc/dev-log/2026-09-18-calibri-carlito-substitute.md.
  fonts:
    - family: DejaVu Sans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
    # Metric-compatible substitutes for the unembedded standard 14. The native
    # renderer addresses the package-qualified families; the bundled web worker
    # loads the same files through FontFace.
    - family: TeX Gyre Heros
      fonts:
        - asset: assets/fonts/TeXGyreHeros-Regular.otf
        - asset: assets/fonts/TeXGyreHeros-Bold.otf
          weight: 700
        - asset: assets/fonts/TeXGyreHeros-Italic.otf
          style: italic
        - asset: assets/fonts/TeXGyreHeros-BoldItalic.otf
          weight: 700
          style: italic
    - family: TeX Gyre Termes
      fonts:
        - asset: assets/fonts/TeXGyreTermes-Regular.otf
        - asset: assets/fonts/TeXGyreTermes-Bold.otf
          weight: 700
        - asset: assets/fonts/TeXGyreTermes-Italic.otf
          style: italic
        - asset: assets/fonts/TeXGyreTermes-BoldItalic.otf
          weight: 700
          style: italic
    - family: TeX Gyre Cursor
      fonts:
        - asset: assets/fonts/TeXGyreCursor-Regular.otf
        - asset: assets/fonts/TeXGyreCursor-Bold.otf
          weight: 700
        - asset: assets/fonts/TeXGyreCursor-Italic.otf
          style: italic
        - asset: assets/fonts/TeXGyreCursor-BoldItalic.otf
          weight: 700
          style: italic
    # Century Gothic / Avant Garde ships upright weights only; the engine
    # obliques them, which matches the AFM advances.
    - family: TeX Gyre Adventor
      fonts:
        - asset: assets/fonts/TeXGyreAdventor-Regular.otf
        - asset: assets/fonts/TeXGyreAdventor-Bold.otf
          weight: 700
    # Calibri's metric-compatible clone, for the unembedded Calibri that Office
    # print drivers emit. Shipped unmodified from upstream, so it is TrueType
    # (and heavily hinted) where the TeX Gyre faces are CFF: 2.6 MB of files
    # against their 1.7 MB, though only 0.86 MB against 0.77 MB once the
    # server compresses them. The OFL reserves the name, so a subset could not
    # be called Carlito - slimming it means renaming it, which is a decision
    # this change does not take.
    - family: Carlito
      fonts:
        - asset: assets/fonts/Carlito-Regular.ttf
        - asset: assets/fonts/Carlito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Carlito-Italic.ttf
          style: italic
        - asset: assets/fonts/Carlito-BoldItalic.ttf
          weight: 700
          style: italic
