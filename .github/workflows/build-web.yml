name: Build Web (main)

run-name: ${{ github.event.head_commit.message || 'Build Web a comando' }}

# Build della web app separata dall'APK e da Windows: ha il suo nome, la sua
# coda e il suo esito verde/rosso. Compila la web app con lo stesso numero
# build degli altri (commit + 25) e tiene il risultato come file della build
# per 7 giorni. La web app online la pubblica Vercel; il job "Online" la mette
# in linea (promuove il deploy di Vercel con lo stesso commit) solo quando questa
# compilazione e' verde e Vercel ha finito senza errori.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  version:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app-version.outputs.version }}
      number: ${{ steps.app-version.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calcola versione e numero build
        id: app-version
        run: |
          commit_epoch="$(git log -1 --format=%ct HEAD)"
          read -r year day hour minute < <(
            TZ=Europe/Rome date -d "@${commit_epoch}" '+%Y %j %H %M'
          )
          # cifra dell'anno . giorno dell'anno (3 cifre) . ora e minuti (Roma)
          version="$((year % 10)).${day}.${hour}${minute}"
          # L'identificativo scritto in testa al messaggio del commit
          # (VERSIONE#BUILD) ha la precedenza: cosi' commit, Actions, release
          # e app mostrano sempre la stessa stringa.
          subject="$(git log -1 --format=%s HEAD)"
          if [[ "$subject" =~ ^([0-9]+\.[0-9]+\.[0-9]+)#[0-9]+ ]]; then
            version="${BASH_REMATCH[1]}"
          fi
          # Numero build = numero del commit (stesso di APK e Windows):
          # commit di main + 25.
          number="$(( $(git rev-list --count HEAD) + 25 ))"
          if [[ "$subject" =~ ^[0-9]+\.[0-9]+\.[0-9]+#([0-9]+) && "${BASH_REMATCH[1]}" != "$number" ]]; then
            echo "::warning::Il numero nel messaggio del commit (${BASH_REMATCH[1]}) e' diverso dal numero build calcolato ($number)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

  web:
    name: "Web ${{ needs.version.outputs.version }}#${{ needs.version.outputs.number }}"
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compila la web app
        working-directory: app
        env:
          DART: dart
          FLUTTER: flutter
          PDF_BUILD_VERSION: ${{ needs.version.outputs.version }}
          PDF_BUILD_NUMBER: ${{ needs.version.outputs.number }}
        run: bash tool/build_web.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DartPDF-Web
          path: app/build/web
          retention-days: 7

  online:
    name: "Online ${{ needs.version.outputs.version }}#${{ needs.version.outputs.number }}"
    needs: [web, version]
    if: ${{ !cancelled() && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Mette online la versione quando Vercel e' pronto
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM: tesonepdf
          VERCEL_PROJECT: prj_SrGeiz0vCcg4dVo8Q6ghtTuQiIqz
          IDENT: ${{ needs.version.outputs.version }}#${{ needs.version.outputs.number }}
        run: |
          exec > >(tee rapporto.txt) 2>&1
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ["VERCEL_TEAM"]
          project = os.environ["VERCEL_PROJECT"]
          sha = os.environ["GITHUB_SHA"]
          ident = os.environ["IDENT"]


          def call(method, path, body=None):
              url = "https://api.vercel.com" + path + ("&" if "?" in path else "?") + "slug=" + team
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, method=method, data=data, headers={
                  "Authorization": "Bearer " + token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode() or "{}")


          def promosso(d):
              sub = d.get("readySubstate")
              return sub == "PROMOTED" or (sub is None and bool(d.get("aliasAssigned")))


          def scadenza_token():
              # Avvisa quando il token di Vercel sta per scadere (best effort).
              try:
                  req = urllib.request.Request("https://api.vercel.com/v5/user/tokens",
                      headers={"Authorization": "Bearer " + token})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      tokens = json.loads(r.read().decode()).get("tokens", [])
                  for t in tokens:
                      if t.get("name") == "dart-pdf-actions" and t.get("expiresAt"):
                          giorni = (t["expiresAt"] / 1000 - time.time()) / 86400
                          print("Il token Vercel scade tra %.0f giorni" % giorni)
                          if giorni < 14:
                              print("::warning title=Token Vercel in scadenza::Il token dart-pdf-actions scade tra %.0f giorni: creane uno nuovo e aggiorna il segreto VERCEL_TOKEN" % giorni)
                          return
                  print("Scadenza del token non trovata")
              except Exception as e:
                  print("Controllo della scadenza del token non riuscito:", e)


          scadenza_token()
          print("Versione", ident, "- commit", sha[:7])
          dep = None
          fine = time.time() + 33 * 60
          while time.time() < fine:
              st, lista = call("GET", f"/v6/deployments?projectId={project}&sha={sha}&limit=5")
              scelti = [x for x in lista.get("deployments", []) if x.get("target") == "production"]
              if st == 200 and scelti:
                  uid = scelti[0]["uid"]
                  st, dep = call("GET", f"/v13/deployments/{uid}")
                  stato = dep.get("readyState")
                  print("Deploy Vercel", uid, "stato", stato, "sottostato", dep.get("readySubstate"), "alias", dep.get("aliasAssigned"))
                  if stato == "READY":
                      break
                  if stato in ("ERROR", "CANCELED"):
                      print("Vercel NON e' riuscito: la versione non va online.")
                      sys.exit(1)
              else:
                  print("Deploy Vercel non ancora comparso", st)
              time.sleep(20)
          else:
              print("Tempo scaduto: Vercel non ha finito.")
              sys.exit(1)

          if promosso(dep):
              print("Gia' online: niente da promuovere.")
              sys.exit(0)

          # Non si torna indietro: se quello online e' piu' recente, non si tocca.
          st, ready = call("GET", f"/v6/deployments?projectId={project}&target=production&state=READY&limit=30")
          online = [x for x in ready.get("deployments", []) if x.get("readySubstate") == "PROMOTED"]
          if online and online[0].get("created", 0) > dep.get("createdAt", dep.get("created", 0)):
              print("Online c'e' gia' una versione piu' recente: non la sostituisco.")
              sys.exit(0)

          st, ris = call("POST", f"/v10/projects/{project}/promote/{dep['id']}", {})
          print("Promozione richiesta, risposta", st, ris if st >= 300 else "")
          if st >= 300:
              sys.exit(1)
          for _ in range(18):
              time.sleep(10)
              st, dep = call("GET", f"/v13/deployments/{dep['id']}")
              if promosso(dep):
                  print("Online:", ident)
                  sys.exit(0)
              print("In attesa della promozione...", dep.get("readySubstate"))
          print("La promozione non risulta completata.")
          sys.exit(1)
          PY

      - name: Pubblica il rapporto come annotazione
        if: always()
        run: |
          sleep 2
          if [[ -f rapporto.txt ]]; then
            body="$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' rapporto.txt)"
            echo "::notice title=Rapporto Online::${body}"
          fi
