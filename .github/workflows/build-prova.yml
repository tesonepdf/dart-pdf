name: Build APK PROVA (ramo prova-sviluppatore)

run-name: "${{ github.event.head_commit.message || 'Build a comando' }}"

# Build della app "DartPDF Prova". Parte dai push sul ramo prova-sviluppatore e usa
# lo stesso procedimento della build ufficiale (build.yml), richiamato da qui:
# i numeri build, la release (app-android-prova) e l'elenco su GitHub restano
# separati da quelli dell'app ufficiale. Dopo il riallineamento a main, il
# prossimo commit e la relativa build ripartono dal numero #10014.

on:
  push:
    branches: [prova-sviluppatore]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
