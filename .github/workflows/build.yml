name: Build APK e Windows

# Parte a ogni push su main e anche a mano dalla scheda "Actions".
# Produce APK Android separati per architettura e windows-x64.zip (Windows, portatile),
# pubblicati come Release del repo. Se nei Secrets ci sono KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD l'APK e' firmato con la tua chiave.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Copiato dal flusso originale del progetto: sistema alcuni plugin
      # Android che altrimenti non compilano.
      - name: Patch hosted Android plugin compatibility
        run: |
          set -euo pipefail

          patch_gradle() {
            local gradle_file="$1"
            local namespace="${2:-}"
            if [[ -z "$gradle_file" ]]; then
              echo "No matching hosted Android Gradle file found; skipping patch."
              return 0
            fi

            python3 - "$gradle_file" "$namespace" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          namespace = sys.argv[2]
          text = path.read_text()
          text = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', text)
          if namespace and 'namespace ' not in text:
              text = text.replace('android {\n', f'android {{\n    namespace "{namespace}"\n', 1)
          path.write_text(text)
          PY
          }

          while IFS= read -r f; do patch_gradle "$f"; done < <(find "$HOME/.pub-cache" -path '*/onnxruntime-*/android/build.gradle')
          while IFS= read -r f; do patch_gradle "$f" dev.irondash.engine_context; done < <(find "$HOME/.pub-cache" -path '*/irondash_engine_context-*/android/build.gradle')
          super_native_gradle="$(find "$HOME/.pub-cache" -path '*/super_native_extensions-*/android/build.gradle' -print -quit)"
          while IFS= read -r f; do patch_gradle "$f" com.superlist.super_native_extensions; done < <(find "$HOME/.pub-cache" -path '*/super_native_extensions-*/android/build.gradle')

          if [[ -n "$super_native_gradle" ]]; then
            cargokit_gradle="$(dirname "$super_native_gradle")/../cargokit/gradle/plugin.gradle"
          else
            cargokit_gradle=""
          fi

          if [[ -n "$cargokit_gradle" && -f "$cargokit_gradle" ]]; then
            python3 - "$cargokit_gradle" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          text = text.replace('for (project in projects) {', 'for (project in projects.values()) {')
          text = text.replace('project.value.getPlugins()', 'project.getPlugins()')
          text = text.replace(
              'return _findFlutterPlugin(project.value.childProjects);',
              '''def found = _findFlutterPlugin(project.childProjects);
                      if (found != null) {
                          return found;
                      }''',
          )
          if 'projects.values()' not in text or 'project.value.getPlugins()' in text:
              raise SystemExit("CargoKit plugin patch target not found")
          path.write_text(text)
          PY
          else
            echo "No CargoKit Gradle plugin found; skipping patch."
          fi

      - name: Prepara la firma (se ci sono i Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Nessuna chiave nei Secrets: uso la chiave di prova."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > app/android/key.properties
          echo "Chiave di firma pronta."

      - name: Compila l'APK
        working-directory: app
        run: |
          # numero di build crescente (minuti dal 1970): Android accetta
          # l'installazione sopra la versione precedente solo se il numero sale
          flutter build apk --release --split-per-abi --build-number=$(( $(date +%s) / 60 ))

      - name: Controllo che lo scanner funzioni dopo la riduzione del codice
        run: |
          shopt -s nullglob
          apks=(app/build/app/outputs/flutter-apk/app-*-release.apk)
          if [[ ${#apks[@]} -ne 3 ]]; then
            echo "Expected three per-ABI APKs, found ${#apks[@]}."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            python3 tool/check_android_scanner.py "$apk"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compila Windows
        working-directory: app
        shell: pwsh
        run: |
          $versionLine = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value
          $buildName = $versionLine.Split('+')[0]
          flutter build windows --release --build-name="$buildName" --build-number="${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { throw "flutter build windows non riuscito ($LASTEXITCODE)" }

      - name: Crea lo zip portatile
        working-directory: app
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          Copy-Item "$env:SystemRoot\System32\msvcp140.dll",
                    "$env:SystemRoot\System32\vcruntime140.dll",
                    "$env:SystemRoot\System32\vcruntime140_1.dll" `
                    -Destination $bundle -Force
          Compress-Archive -Path "$bundle/*" -DestinationPath windows-x64.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: app/windows-x64.zip
          retention-days: 7

  release:
    needs: [apk, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dl/apk

      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dl/windows

      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dl/apk/app-arm64-v8a-release.apk app-arm64-v8a.apk
          cp dl/apk/app-armeabi-v7a-release.apk app-armeabi-v7a.apk
          cp dl/apk/app-x86_64-release.apk app-x86_64.apk
          cp dl/windows/windows-x64.zip windows-x64.zip
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            app-arm64-v8a.apk app-armeabi-v7a.apk app-x86_64.apk windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Commit ${GITHUB_SHA}" \
            --latest
