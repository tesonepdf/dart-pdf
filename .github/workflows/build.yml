name: Build APK UFFICIALE (main)

run-name: ${{ github.event.head_commit.message || (inputs.solo_contatore && 'Contatore (build fittizia, non compila)') || 'Build a comando' }}

# A ogni push su main produce l'APK Android (solo arm64, piu' leggero) e
# aggiorna l'unica release Android (normale, non pre-release).
# Windows (windows-x64.zip) si compila solo a comando: Actions > Run workflow.
# La firma Android permanente richiede i quattro Secrets documentati in
# app/RELEASING.md.

on:
  # Questo file e' la build UFFICIALE: parte solo dai push su main.
  # Il ramo prova ha il suo workflow (build-prova.yml), che richiama questo
  # file: cosi' le due build hanno elenchi e contatori GitHub separati.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      solo_contatore:
        description: 'Build fittizia: aumenta solo il contatore, non compila nulla'
        type: boolean
        default: false
  workflow_call:
    inputs:
      solo_contatore:
        type: boolean
        default: false

permissions:
  contents: read

# Una build alla volta per ramo: cosi' il numero build (letto dalla release del
# ramo) non puo' essere preso da due build insieme. I due rami non si bloccano
# tra loro.
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'
  # Il ramo prova-sviluppatore produce un'app separata ("DartPDF Prova", id
  # it.tesonepdf.pdf.prova) con le proprie release e il proprio canale di
  # aggiornamenti: si installa accanto a quella normale senza sostituirla.
  APP_ID_SUFFIX: ${{ github.ref_name == 'prova-sviluppatore' && '.prova' || '' }}
  APP_LABEL: ${{ github.ref_name == 'prova-sviluppatore' && 'DartPDF Prova' || 'DartPDF' }}
  RELEASE_PREFIX: ${{ github.ref_name == 'prova-sviluppatore' && 'prova' || 'build' }}
  ANDROID_TAG: ${{ github.ref_name == 'prova-sviluppatore' && 'app-android-prova' || 'app-android-latest' }}
  # Nessuna lettera dopo il numero: la prova si riconosce perche' parte da 10001.
  NUM_SUFFIX: ''
  # Prova: 10012 + numero della run (la run #3 era la 10015, la #4 e' la 10016).
  NUM_BASE: ${{ github.ref_name == 'prova-sviluppatore' && '10012' || '0' }}

jobs:
  version:
    if: ${{ !inputs.solo_contatore }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app-version.outputs.version }}
      number: ${{ steps.app-version.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calcola versione e numero build
        id: app-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit_epoch="$(git log -1 --format=%ct HEAD)"
          read -r year day hour minute < <(
            TZ=Europe/Rome date -d "@${commit_epoch}" '+%Y %j %H %M'
          )
          version="$((year - 2020)).${day}.${hour}${minute}"
          # Il numero dopo il # dell'app e' sempre calcolabile dalla run:
          # ufficiale = numero della run (run #105 -> app #105);
          # prova     = NUM_BASE + numero della run del suo workflow (run #4 ->
          #             app #10016). Lo stesso numero e' scritto nel titolo delle
          #             run della prova (build-prova.yml).
          number="$((NUM_BASE + ${{ github.run_number }}))"
          echo "VERSIONE=${version}" >> "$GITHUB_ENV"
          echo "NUMERO=${number}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

  apk:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ needs.version.outputs.version }}
      number: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1 # il numero build arriva dal job version
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Riusa tra una build e l'altra cio' che non cambia: dipendenze Gradle,
      # pacchetti Cargo e la compilazione nativa/Android gia' fatta. Chiave
      # legata ai file che la invalidano (pubspec.lock, gradle), cosi' una
      # dipendenza nuova rifa' tutto da zero.
      - name: Cache Gradle, Cargo e compilazione Android
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            app/build
            app/.dart_tool/flutter_build
          key: apk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock', 'pubspec.lock', 'app/android/**/*.gradle', 'app/android/**/*.kts', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            apk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - run: flutter pub get

      - name: Imposta versione e numero build
        run: |
          echo "VERSIONE=${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"
          echo "NUMERO=${{ needs.version.outputs.number }}" >> "$GITHUB_ENV"

      # Copiato dal flusso originale del progetto: sistema alcuni plugin
      # Android che altrimenti non compilano.
      - name: Patch hosted Android plugin compatibility
        run: |
          set -euo pipefail

          patch_gradle() {
            local gradle_file="$1"
            local namespace="${2:-}"
            if [[ -z "$gradle_file" ]]; then
              echo "No matching hosted Android Gradle file found; skipping patch."
              return 0
            fi

            python3 - "$gradle_file" "$namespace" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          namespace = sys.argv[2]
          text = path.read_text()
          text = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', text)
          if namespace and 'namespace ' not in text:
              text = text.replace('android {\n', f'android {{\n    namespace "{namespace}"\n', 1)
          path.write_text(text)
          PY
          }

          while IFS= read -r f; do patch_gradle "$f"; done < <(find "$HOME/.pub-cache" -path '*/onnxruntime-*/android/build.gradle')
          while IFS= read -r f; do patch_gradle "$f" dev.irondash.engine_context; done < <(find "$HOME/.pub-cache" -path '*/irondash_engine_context-*/android/build.gradle')
          super_native_gradle="$(find "$HOME/.pub-cache" -path '*/super_native_extensions-*/android/build.gradle' -print -quit)"
          while IFS= read -r f; do patch_gradle "$f" com.superlist.super_native_extensions; done < <(find "$HOME/.pub-cache" -path '*/super_native_extensions-*/android/build.gradle')

          if [[ -n "$super_native_gradle" ]]; then
            cargokit_gradle="$(dirname "$super_native_gradle")/../cargokit/gradle/plugin.gradle"
          else
            cargokit_gradle=""
          fi

          if [[ -n "$cargokit_gradle" && -f "$cargokit_gradle" ]]; then
            python3 - "$cargokit_gradle" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          text = text.replace('for (project in projects) {', 'for (project in projects.values()) {')
          text = text.replace('project.value.getPlugins()', 'project.getPlugins()')
          text = text.replace(
              'return _findFlutterPlugin(project.value.childProjects);',
              '''def found = _findFlutterPlugin(project.childProjects);
                      if (found != null) {
                          return found;
                      }''',
          )
          if 'projects.values()' not in text or 'project.value.getPlugins()' in text:
              raise SystemExit("CargoKit plugin patch target not found")
          path.write_text(text)
          PY
          else
            echo "No CargoKit Gradle plugin found; skipping patch."
          fi

      - name: Prepara la firma Android permanente
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > app/android/key.properties
          echo "Chiave di firma pronta."

      - name: Compila l'APK
        working-directory: app
        run: |
          flutter --suppress-analytics build apk --release \
            --no-tree-shake-icons --target-platform android-arm64 \
            --build-name="$VERSIONE" \
            --build-number="$NUMERO" \
            --dart-define=PDF_BUILD_COMMIT="$GITHUB_SHA" \
            --dart-define=PDF_ANDROID_TAG="$ANDROID_TAG"

      - name: Controllo che lo scanner funzioni dopo la riduzione del codice
        run: |
          apk="app/build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            echo "Universal APK not found: $apk"
            exit 1
          fi
          python3 tool/check_android_scanner.py "$apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  windows:
    needs: version
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.solo_contatore }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compila Windows
        working-directory: app
        shell: pwsh
        run: |
          flutter build windows --release --build-name="${{ needs.version.outputs.version }}" --build-number="${{ needs.version.outputs.number }}"
          if ($LASTEXITCODE -ne 0) { throw "flutter build windows non riuscito ($LASTEXITCODE)" }

      - name: Crea lo zip portatile
        working-directory: app
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          Copy-Item "$env:SystemRoot\System32\msvcp140.dll",
                    "$env:SystemRoot\System32\vcruntime140.dll",
                    "$env:SystemRoot\System32\vcruntime140_1.dll" `
                    -Destination $bundle -Force
          Compress-Archive -Path "$bundle/*" -DestinationPath windows-x64.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: app/windows-x64.zip
          retention-days: 7

  release:
    needs: [apk, windows, version]
    if: ${{ !cancelled() && needs.apk.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dl/apk

      - uses: actions/download-artifact@v8
        if: needs.windows.result == 'success'
        with:
          name: windows
          path: dl/windows

      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONE: ${{ needs.version.outputs.version }}
          NUMERO: ${{ needs.version.outputs.number }}
        run: |
          # se un comando fallisce, scrive quale e perche' (annotazione leggibile)
          trap 'echo "::error::Pubblica la Release fallita alla riga $LINENO: $BASH_COMMAND"' ERR
          ls -la dl dl/apk
          # riprova i comandi gh se GitHub risponde con un errore momentaneo
          gh() { local i; for i in 1 2 3 4; do command gh "$@" && return 0; echo "gh $1 $2: tentativo $i fallito"; sleep 8; done; return 1; }
          cp dl/apk/app-release.apk DartPDF-Android.apk
          assets=(DartPDF-Android.apk)
          if [[ -f dl/windows/windows-x64.zip ]]; then
            cp dl/windows/windows-x64.zip windows-x64.zip
            assets+=(windows-x64.zip)
          fi

          # Una sola release per canale (nessuna build numerata a parte):
          # - main: tag app-android-latest, release normale e "Latest"
          # - prova-sviluppatore: tag app-android-prova, release normale, mai "Latest"
          # Il numero build e' nel titolo (#N) e nel marcatore delle note, che
          # l'app confronta per decidere se c'e' un aggiornamento.
          android_tag="$ANDROID_TAG"
          latest_flag="$([[ "$RELEASE_PREFIX" == build ]] && echo true || echo false)"

          # Il canale avanza solo con numero build piu' alto di quello gia'
          # pubblicato: cosi' una build non viene saltata perche' nel frattempo
          # e' arrivato un altro push.
          current_build="$(gh release view "$android_tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null | sed -n 's/.*<!-- app-build: \([0-9][0-9]*\) -->.*/\1/p' | head -n1 || true)"
          if [[ -z "$current_build" || "$NUMERO" -gt "$current_build" ]]; then
            android_title="$APP_LABEL #${NUMERO}${NUM_SUFFIX}"
            android_notes="$(printf 'Build #%s%s\nNuova versione Android disponibile. Scegli tu se scaricarla e installarla.\n<!-- main-sha: %s -->\n<!-- app-version: %s -->\n<!-- app-build: %s -->' "$NUMERO" "$NUM_SUFFIX" "$GITHUB_SHA" "$VERSIONE" "$NUMERO")"

            if gh release view "$android_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$android_tag" \
                "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" --clobber
              android_release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$android_tag" --jq '.id')"
              old_asset_ids="$(gh api "repos/$GITHUB_REPOSITORY/releases/$android_release_id/assets" \
                --jq '.[] | select(.name != "DartPDF-Android.apk" and .name != "windows-x64.zip" and .name != "release-info.json") | .id')"
              if [[ -n "$old_asset_ids" ]]; then
                while IFS= read -r asset_id; do
                  gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                done <<< "$old_asset_ids"
              fi
              # Se il tag era ancora una pre-release, diventa release normale.
              gh release edit "$android_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$android_title" \
                --notes "$android_notes" \
                --prerelease=false \
                --latest="$latest_flag"
            else
              gh release create "$android_tag" \
                "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "$android_title" \
                --notes "$android_notes" \
                --latest="$latest_flag"
            fi
            # Copia delle informazioni della release, scaricabile senza API
            # (l'app la legge per prima: niente limite di richieste GitHub).
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$android_tag" > release-info.json
            gh release upload "$android_tag" release-info.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Il canale Android e' gia' alla build $current_build (>= $NUMERO): non lo sposto."
          fi
