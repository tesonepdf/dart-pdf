name: Build APK (Windows a comando)

run-name: ${{ github.event.head_commit.message || (inputs.solo_contatore && 'Contatore (build fittizia, non compila)') || 'Build a comando' }}

# A ogni push su main produce l'APK Android (solo arm64, piu' leggero),
# pubblica la build numerata e aggiorna il prerelease Android rolling.
# Windows (windows-x64.zip) si compila solo a comando: Actions > Run workflow.
# La firma Android permanente richiede i quattro Secrets documentati in
# app/RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      solo_contatore:
        description: 'Build fittizia: aumenta solo il contatore, non compila nulla'
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  version:
    if: ${{ !inputs.solo_contatore }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app-version.outputs.version }}
      number: ${{ steps.app-version.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calcola versione e numero build
        id: app-version
        run: |
          commit_epoch="$(git log -1 --format=%ct HEAD)"
          read -r year day hour minute < <(
            TZ=Europe/Rome date -d "@${commit_epoch}" '+%Y %-j %-H %-M'
          )
          version="$((year - 2020)).${day}.${hour}${minute}"
          number="$(git rev-list --count HEAD)"
          echo "VERSIONE=${version}" >> "$GITHUB_ENV"
          echo "NUMERO=${number}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

  apk:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ needs.version.outputs.version }}
      number: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Imposta versione e numero build
        run: |
          echo "VERSIONE=${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"
          echo "NUMERO=${{ needs.version.outputs.number }}" >> "$GITHUB_ENV"

      # Copiato dal flusso originale del progetto: sistema alcuni plugin
      # Android che altrimenti non compilano.
      - name: Patch hosted Android plugin compatibility
        run: |
          set -euo pipefail

          patch_gradle() {
            local gradle_file="$1"
            local namespace="${2:-}"
            if [[ -z "$gradle_file" ]]; then
              echo "No matching hosted Android Gradle file found; skipping patch."
              return 0
            fi

            python3 - "$gradle_file" "$namespace" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          namespace = sys.argv[2]
          text = path.read_text()
          text = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', text)
          if namespace and 'namespace ' not in text:
              text = text.replace('android {\n', f'android {{\n    namespace "{namespace}"\n', 1)
          path.write_text(text)
          PY
          }

          while IFS= read -r f; do patch_gradle "$f"; done < <(find "$HOME/.pub-cache" -path '*/onnxruntime-*/android/build.gradle')
          while IFS= read -r f; do patch_gradle "$f" dev.irondash.engine_context; done < <(find "$HOME/.pub-cache" -path '*/irondash_engine_context-*/android/build.gradle')
          super_native_gradle="$(find "$HOME/.pub-cache" -path '*/super_native_extensions-*/android/build.gradle' -print -quit)"
          while IFS= read -r f; do patch_gradle "$f" com.superlist.super_native_extensions; done < <(find "$HOME/.pub-cache" -path '*/super_native_extensions-*/android/build.gradle')

          if [[ -n "$super_native_gradle" ]]; then
            cargokit_gradle="$(dirname "$super_native_gradle")/../cargokit/gradle/plugin.gradle"
          else
            cargokit_gradle=""
          fi

          if [[ -n "$cargokit_gradle" && -f "$cargokit_gradle" ]]; then
            python3 - "$cargokit_gradle" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          text = text.replace('for (project in projects) {', 'for (project in projects.values()) {')
          text = text.replace('project.value.getPlugins()', 'project.getPlugins()')
          text = text.replace(
              'return _findFlutterPlugin(project.value.childProjects);',
              '''def found = _findFlutterPlugin(project.childProjects);
                      if (found != null) {
                          return found;
                      }''',
          )
          if 'projects.values()' not in text or 'project.value.getPlugins()' in text:
              raise SystemExit("CargoKit plugin patch target not found")
          path.write_text(text)
          PY
          else
            echo "No CargoKit Gradle plugin found; skipping patch."
          fi

      - name: Prepara la firma Android permanente
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > app/android/key.properties
          echo "Chiave di firma pronta."

      - name: Compila l'APK
        working-directory: app
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$VERSIONE" \
            --build-number="$NUMERO" \
            --dart-define=PDF_BUILD_COMMIT="$GITHUB_SHA"

      - name: Controllo che lo scanner funzioni dopo la riduzione del codice
        run: |
          apk="app/build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            echo "Universal APK not found: $apk"
            exit 1
          fi
          python3 tool/check_android_scanner.py "$apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  windows:
    needs: version
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.solo_contatore }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compila Windows
        working-directory: app
        shell: pwsh
        run: |
          flutter build windows --release --build-name="${{ needs.version.outputs.version }}" --build-number="${{ needs.version.outputs.number }}"
          if ($LASTEXITCODE -ne 0) { throw "flutter build windows non riuscito ($LASTEXITCODE)" }

      - name: Crea lo zip portatile
        working-directory: app
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          Copy-Item "$env:SystemRoot\System32\msvcp140.dll",
                    "$env:SystemRoot\System32\vcruntime140.dll",
                    "$env:SystemRoot\System32\vcruntime140_1.dll" `
                    -Destination $bundle -Force
          Compress-Archive -Path "$bundle/*" -DestinationPath windows-x64.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: app/windows-x64.zip
          retention-days: 7

  release:
    needs: [apk, windows, version]
    if: ${{ !cancelled() && needs.apk.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dl/apk

      - uses: actions/download-artifact@v8
        if: needs.windows.result == 'success'
        with:
          name: windows
          path: dl/windows

      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONE: ${{ needs.version.outputs.version }}
          NUMERO: ${{ needs.version.outputs.number }}
        run: |
          cp dl/apk/app-release.apk DartPDF-Android.apk
          assets=(DartPDF-Android.apk)
          if [[ -f dl/windows/windows-x64.zip ]]; then
            cp dl/windows/windows-x64.zip windows-x64.zip
            assets+=(windows-x64.zip)
          fi
          build_tag="build-${NUMERO}"
          build_title="Build #${NUMERO} - versione ${VERSIONE}"
          build_notes="Commit ${GITHUB_SHA}"
          if gh release view "$build_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$build_tag" \
              "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$build_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$build_title" \
              --notes "$build_notes"
          else
            gh release create "$build_tag" \
              "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$build_title" \
              --notes "$build_notes" \
              --latest
          fi

          latest_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$latest_main_sha" == "$GITHUB_SHA" ]]; then
            android_tag="app-android-latest"
            android_notes="$(printf 'Nuova versione Android disponibile. Scegli tu se scaricarla e installarla.\n<!-- main-sha: %s -->\n<!-- app-version: %s -->\n<!-- app-build: %s -->' "$GITHUB_SHA" "$VERSIONE" "$NUMERO")"

            if gh release view "$android_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$android_tag" \
                DartPDF-Android.apk \
                --repo "$GITHUB_REPOSITORY" --clobber
              android_release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$android_tag" --jq '.id')"
              old_asset_ids="$(gh api "repos/$GITHUB_REPOSITORY/releases/$android_release_id/assets" \
                --jq '.[] | select(.name != "DartPDF-Android.apk") | .id')"
              if [[ -n "$old_asset_ids" ]]; then
                while IFS= read -r asset_id; do
                  gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                done <<< "$old_asset_ids"
              fi
              gh release edit "$android_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "DartPDF Android latest" \
                --notes "$android_notes"
            else
              gh release create "$android_tag" \
                DartPDF-Android.apk \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "DartPDF Android latest" \
                --notes "$android_notes" \
                --prerelease
            fi
          else
            echo "Main advanced to $latest_main_sha; keeping this build release without moving the rolling Android tag."
          fi
