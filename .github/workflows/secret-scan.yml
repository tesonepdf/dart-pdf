name: Secret scan

on:
  push:
    branches: [main, deploy]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Use the upstream CLI without a third-party action or a paid service.
      # Pin both version and checksum; do not upload reports or matching lines.
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          url=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
                 --retry-delay 5 "$url" --output "$archive"; then ok=1; break; fi
            echo "Download Gitleaks non riuscito (tentativo $i), riprovo tra $((i * 10))s"
            sleep $((i * 10))
          done
          [ "$ok" = 1 ] || exit 1
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Verify fixture exceptions do not skip new keys
        run: python3 tool/check_secret_scan.py
      - name: Scan full fetched history with redacted output
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/secret-logs"
          gitleaks git . --log-opts="--all" --redact=100 --no-banner --verbose \
            --report-format json --report-path "$RUNNER_TEMP/secret-logs/gitleaks-report.json" \
            2>&1 | tee "$RUNNER_TEMP/secret-logs/gitleaks.log"
          code=${PIPESTATUS[0]}
          { echo '### Secret scan (log completo)'; echo '```'; cat "$RUNNER_TEMP/secret-logs/gitleaks.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Upload log completi
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secret-scan-logs-${{ github.run_number }}
          path: ${{ runner.temp }}/secret-logs
          if-no-files-found: ignore
          retention-days: 30
