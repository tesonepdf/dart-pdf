name: CI

# Il titolo parte dal numero del commit, lo stesso della build (#220 ...).
run-name: ${{ github.event.head_commit.message && format('CI {0}', github.event.head_commit.message) || 'CI' }}

on:
  push:
    branches: [main, master, prova-sviluppatore]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Riusa Gradle e Cargo tra una CI e l'altra: il download di Gradle da
      # services.gradle.org a volte da' errore 504 e fa fallire il passo.
      - name: Cache Gradle e Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
          key: ci-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock', 'pubspec.lock', 'app/android/**/*.gradle', 'app/android/**/*.kts', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          # Se la CI non ha ancora una sua cache, parte da quella della build
          # APK (stessi file Gradle): senza, scaricava Gradle da zero e, se il
          # download falliva, la cache non veniva mai salvata.
          restore-keys: |
            ci-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
            apk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: flutter pub get
        run: flutter pub get

      # Analyze shipped library sources only: the workspace root also contains
      # DA-VALUTARE, and document_library.dart is an unintegrated draft.
      - name: flutter analyze active sources
        run: |
          set +e
          mapfile -d '' -t sources < <(
            find app/lib packages -type f -name '*.dart' \
              ! -path 'app/lib/document_library.dart' \
              ! -path '*/test/*' -print0 | sort -z
          )
          flutter analyze --no-fatal-infos --no-fatal-warnings "${sources[@]}" 2>&1 | tee /tmp/step.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=flutter analyze active sources::$(grep -E 'error •|Error' /tmp/step.txt | head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$code"

      # These two app suites exercise APIs that are not integrated in this
      # branch yet; continue running every other app test.
      - name: flutter test app
        working-directory: app
        run: |
          set +e
          mapfile -d '' -t tests < <(
            find test -type f -name '*_test.dart' \
              ! -path 'test/document_library_test.dart' \
              ! -path 'test/ocr_resume_test.dart' -print0 | sort -z
          )
          flutter test --reporter json "${tests[@]}" > /tmp/test.json 2> /tmp/test.err
          code=$?
          if [ "$code" -ne 0 ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/test_summary.py" /tmp/test.json /tmp/test.err
          fi
          exit "$code"

      - name: flutter test pdf_document redaction
        working-directory: packages/pdf_document
        run: |
          set +e
          flutter test --reporter json \
            test/redaction_test.dart \
            test/redaction_raster_test.dart \
            test/redaction_hidden_content_test.dart \
            test/redaction_bypass_test.dart > /tmp/test.json 2> /tmp/test.err
          code=$?
          if [ "$code" -ne 0 ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/test_summary.py" /tmp/test.json /tmp/test.err
          fi
          exit "$code"

      - name: flutter test dart_pdf_editor text editing
        working-directory: packages/dart_pdf_editor
        run: |
          set +e
          flutter test --reporter json \
            test/editing_autosize_rotation_test.dart \
            test/editing_mobile_toolbar_test.dart \
            test/viewer_intents_test.dart \
            test/paste_routing_test.dart > /tmp/test.json 2> /tmp/test.err
          code=$?
          if [ "$code" -ne 0 ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/test_summary.py" /tmp/test.json /tmp/test.err
          fi
          exit "$code"

      # Copiato dal flusso originale del progetto: sistema alcuni plugin
      # Android che altrimenti non compilano.
      - name: Patch hosted Android plugin compatibility
        run: |
          set -euo pipefail

          patch_gradle() {
            local gradle_file="$1"
            local namespace="${2:-}"
            if [[ -z "$gradle_file" ]]; then
              echo "No matching hosted Android Gradle file found; skipping patch."
              return 0
            fi

            python3 - "$gradle_file" "$namespace" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          namespace = sys.argv[2]
          text = path.read_text()
          text = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', text)
          if namespace and 'namespace ' not in text:
              text = text.replace('android {\n', f'android {{\n    namespace "{namespace}"\n', 1)
          path.write_text(text)
          PY
          }

          while IFS= read -r f; do patch_gradle "$f"; done < <(find "$HOME/.pub-cache" -path '*/onnxruntime-*/android/build.gradle')
          while IFS= read -r f; do patch_gradle "$f" dev.irondash.engine_context; done < <(find "$HOME/.pub-cache" -path '*/irondash_engine_context-*/android/build.gradle')
          super_native_gradle="$(find "$HOME/.pub-cache" -path '*/super_native_extensions-*/android/build.gradle' -print -quit)"
          while IFS= read -r f; do patch_gradle "$f" com.superlist.super_native_extensions; done < <(find "$HOME/.pub-cache" -path '*/super_native_extensions-*/android/build.gradle')

          if [[ -n "$super_native_gradle" ]]; then
            cargokit_gradle="$(dirname "$super_native_gradle")/../cargokit/gradle/plugin.gradle"
          else
            cargokit_gradle=""
          fi

          if [[ -n "$cargokit_gradle" && -f "$cargokit_gradle" ]]; then
            python3 - "$cargokit_gradle" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          text = text.replace('for (project in projects) {', 'for (project in projects.values()) {')
          text = text.replace('project.value.getPlugins()', 'project.getPlugins()')
          text = text.replace(
              'return _findFlutterPlugin(project.value.childProjects);',
              '''def found = _findFlutterPlugin(project.childProjects);
                      if (found != null) {
                          return found;
                      }''',
          )
          if 'projects.values()' not in text or 'project.value.getPlugins()' in text:
              raise SystemExit("CargoKit plugin patch target not found")
          path.write_text(text)
          PY
          else
            echo "No CargoKit Gradle plugin found; skipping patch."
          fi

      # Fino a 3 tentativi: se GitHub o Gradle non rispondono (HTTP 504) si
      # riprova; un errore di compilazione vero fallisce comunque alla fine.
      - name: flutter build apk --debug
        working-directory: app
        run: |
          set +e
          for i in 1 2 3; do
            flutter build apk --debug 2>&1 | tee /tmp/step.txt
            code=${PIPESTATUS[0]}
            [ "$code" -eq 0 ] && break
            echo "Tentativo $i fallito, riprovo tra 20s"
            sleep 20
          done
          if [ "$code" -ne 0 ]; then
            echo "::error title=flutter build apk::$(tail -c 6000 /tmp/step.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$code"
