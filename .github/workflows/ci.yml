name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Ogni passaggio scrive l'esito completo anche come annotazione della
      # run, cosi' gli errori si leggono senza scaricare i log.
      - name: flutter analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/step.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=flutter analyze::$(grep -E 'error •|Error' /tmp/step.txt | head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$code"

      - name: flutter test
        working-directory: app
        run: |
          set +e
          flutter test 2>&1 | tee /tmp/step.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=flutter test::$( (grep '❌' /tmp/step.txt | sed -E 's#.*/app/test/##' | head -c 30000; echo '--- dettagli ---'; grep -A10 -m2 '❌.*english_regional' /tmp/step.txt | head -c 6000; tail -n 2 /tmp/step.txt) | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$code"

      - name: flutter build apk --debug
        working-directory: app
        run: |
          set +e
          flutter build apk --debug 2>&1 | tee /tmp/step.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=flutter build apk::$(tail -c 6000 /tmp/step.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$code"
