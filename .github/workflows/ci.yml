name: CI

# Il titolo parte dal numero del commit, lo stesso della build (#220 ...).
run-name: ${{ github.event.head_commit.message && format('CI {0}', github.event.head_commit.message) || 'CI' }}

on:
  push:
    branches: [main, master, prova-sviluppatore]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # Ogni passaggio scrive l'esito completo anche come annotazione della
      # run, cosi' gli errori si leggono senza scaricare i log.
      - name: flutter analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/step.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=flutter analyze::$(grep -E 'error •|Error' /tmp/step.txt | head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$code"

      - name: flutter test
        working-directory: app
        run: |
          set +e
          flutter test --reporter json > /tmp/test.json 2> /tmp/test.err
          code=$?
          if [ "$code" -ne 0 ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/test_summary.py" /tmp/test.json /tmp/test.err
          fi
          exit "$code"

      - name: flutter test pdf_document redaction
        working-directory: packages/pdf_document
        run: |
          flutter test --reporter expanded \
            test/redaction_test.dart \
            test/redaction_raster_test.dart \
            test/redaction_hidden_content_test.dart \
            test/redaction_bypass_test.dart

      - name: flutter test dart_pdf_editor text editing
        working-directory: packages/dart_pdf_editor
        run: |
          flutter test --reporter expanded \
            test/editing_autosize_rotation_test.dart \
            test/editing_text_edit_test.dart \
            test/viewer_intents_test.dart \
            test/paste_routing_test.dart

      - name: flutter build apk --debug
        working-directory: app
        run: |
          set +e
          flutter build apk --debug 2>&1 | tee /tmp/step.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=flutter build apk::$(tail -c 6000 /tmp/step.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$code"
